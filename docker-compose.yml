services:
  wireguard:
    image: ${WIREGUARD_IMAGE:-linuxserver/wireguard:latest}
    container_name: ${WIREGUARD_CONTAINER_NAME:-wireguard}
    network_mode: bridge # 默认桥接模式
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      - SERVERURL=${SERVERURL:?set SERVERURL in .env}
      - SERVERPORT=${SERVERPORT:-1234}
      - PEERS=${PEERS:-10}
      - LOCAL_NODE_PREFIX=${LOCAL_NODE_PREFIX:-peer}
      - PEERDNS=${PEERDNS:-1.1.1.1}
      - INTERNAL_SUBNET=${INTERNAL_SUBNET:-10.66.66.0/24}
      - AWG_JC=${AWG_JC:-}
      - AWG_JMIN=${AWG_JMIN:-}
      - AWG_JMAX=${AWG_JMAX:-}
      - AWG_S1=${AWG_S1:-}
      - AWG_S2=${AWG_S2:-}
      - AWG_S3=${AWG_S3:-}
      - AWG_S4=${AWG_S4:-}
      - AWG_H1=${AWG_H1:-}
      - AWG_H2=${AWG_H2:-}
      - AWG_H3=${AWG_H3:-}
      - AWG_H4=${AWG_H4:-}
      - AWG_I1=${AWG_I1:-}
      - AWG_I2=${AWG_I2:-}
      - AWG_I3=${AWG_I3:-}
      - AWG_I4=${AWG_I4:-}
      - AWG_I5=${AWG_I5:-}
    ports:
      - "${SERVERPORT:-1234}:51820/udp"
    volumes:
      - ./vpn-config:/config
    restart: unless-stopped

  vpn-admin:
    build:
      context: ./admin
    container_name: ${ADMIN_CONTAINER_NAME:-vpn-admin}
    network_mode: ${ADMIN_NETWORK_MODE:-host}
    working_dir: ${VPN_DIR:-/app/vpn}/admin
    environment:
      - APP_SECRET=${APP_SECRET:?set APP_SECRET in .env}
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in .env}
      - REDIS_URL=${REDIS_URL:?set REDIS_URL in .env}
      - TZ=${TZ:-Asia/Shanghai}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-19090}
      - VPN_DIR=${VPN_DIR:-/app/vpn}
      - URL_PREFIX=${URL_PREFIX-/sub/clash}
      - LOCAL_NODE_PREFIX=${LOCAL_NODE_PREFIX:-peer}
      - STARTUP_WAIT_SECONDS=${STARTUP_WAIT_SECONDS:-90}
      - ADMIN_SERVER=${ADMIN_SERVER:-simple}
      - ADMIN_UPDATER_IMAGE=${ADMIN_UPDATER_IMAGE:-}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-2}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
      - MALLOC_ARENA_MAX=${MALLOC_ARENA_MAX:-2}
      - PYTHONOPTIMIZE=${PYTHONOPTIMIZE:-2}
      - PYTHONDONTWRITEBYTECODE=${PYTHONDONTWRITEBYTECODE:-1}
      - EXTERNAL_SUBSCRIPTION_TIMEOUT=${EXTERNAL_SUBSCRIPTION_TIMEOUT:-4}
      - EXTERNAL_SUBSCRIPTION_MAX_BYTES=${EXTERNAL_SUBSCRIPTION_MAX_BYTES:-1048576}
      - EXTERNAL_SUBSCRIPTION_CACHE_TTL=${EXTERNAL_SUBSCRIPTION_CACHE_TTL:-300}
      - EXTERNAL_SUBSCRIPTION_STALE_TTL=${EXTERNAL_SUBSCRIPTION_STALE_TTL:-86400}
      - EXTERNAL_SUBSCRIPTION_FAILURE_LOG_COOLDOWN=${EXTERNAL_SUBSCRIPTION_FAILURE_LOG_COOLDOWN:-1800}
      - EXTERNAL_SUBSCRIPTION_MAX_FAILURES=${EXTERNAL_SUBSCRIPTION_MAX_FAILURES:-10}
      - EXTERNAL_SUBSCRIPTION_PROXY=${EXTERNAL_SUBSCRIPTION_PROXY:-}
      - UPDATE_REPO_DIR=${UPDATE_REPO_DIR:-/app/vpn/wg-clash-admin}
      - UPDATE_REPO_URL=${UPDATE_REPO_URL:-https://github.com/jqmzfj/wg-clash-admin.git}
      - UPDATE_BRANCH=${UPDATE_BRANCH:-main}
      - UPDATE_VERSION_FILE=${UPDATE_VERSION_FILE:-VERSION}
      - UPDATE_CHECK_INTERVAL_SECONDS=${UPDATE_CHECK_INTERVAL_SECONDS:-18000}
      - UPDATE_SYNC_COMPOSE=${UPDATE_SYNC_COMPOSE:-false}
      - UPDATE_SYNC_PATHS=${UPDATE_SYNC_PATHS:-admin,run.sh,generate_clash_yaml.py,README.md,.env.example,VERSION}
    volumes:
      - .:${VPN_DIR:-/app/vpn}
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
